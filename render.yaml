services:
  - type: web
    name: sibd-backend
    runtime: python
    region: ohio
    plan: free

    rootDir: backend

    buildCommand: pip install -r requirements.txt

    preDeployCommand: alembic upgrade head

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      # ── Aplicação ──────────────────────────────────────────────
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_SECRET_KEY
        generateValue: true

      # ── JWT ────────────────────────────────────────────────────
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      # ── Banco de dados ─────────────────────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: sibd-db
          property: connectionString

      # ── CORS ───────────────────────────────────────────────────
      - key: CORS_ORIGINS
        value: https://sibd-app.netlify.app   # substitua pela URL real do Netlify

      # ── Groq (LLM) ─────────────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false       # preencher manualmente no painel
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_MAX_TOKENS
        value: "1024"

      # ── Cohere (Embeddings) ────────────────────────────────────
      - key: COHERE_API_KEY
        sync: false       # preencher manualmente no painel
      - key: COHERE_EMBEDDING_MODEL
        value: embed-multilingual-v3.0

      # ── Supabase Storage ───────────────────────────────────────
      - key: SUPABASE_URL
        sync: false       # preencher manualmente no painel
      - key: SUPABASE_SERVICE_KEY
        sync: false       # preencher manualmente no painel

databases:
  - name: sibd-db
    databaseName: sibd
    user: sibd_user
    plan: free
